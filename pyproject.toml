[project]
name = "vaanikhata"
version = "1.0.0"
description = "Multilingual Voice Khata for Indian Kirana Stores"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "websockets>=12.0,<14.0",
    "python-dotenv>=1.0,<2.0",
    "colorama>=0.4.6",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.app:app"
